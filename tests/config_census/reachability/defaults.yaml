area: defaults
entries:
  - path: "defaults.compression.algorithm"
    classification: unverified
    note: "Go field Algorithm is declared on 2 config types (CompressionConfig, IntegrityConfig), so a read cannot be attributed by name alone; needs type-aware analysis"
  - path: "defaults.compression.enabled"
    classification: connected
    evidence:
      file: "internal/cli/backup_factory.go"
      expression: "if cc := job.Compression; cc != nil && cc.Enabled"
    behavioural_proof: verified
    note: "Proven behaviourally in tests/config_census/behaviour_test.go: two configurations differing only in this key resolve to different job values. The name-collision heuristic could not attribute the read, since Enabled is declared on 7 config types; the behavioural test settles it, which is why behavioural proof outranks static inference here. Inheritance happens at internal/config/loader.go:103."
  - path: "defaults.compression.level"
    classification: connected
    evidence:
      file: "internal/cli/backup_factory.go"
      expression: "level := cc.Level"
    behavioural_proof: pending
    needs: "a suite assertion comparing behaviour across differing values of this key"
