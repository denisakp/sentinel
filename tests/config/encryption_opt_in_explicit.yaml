version: "1.0"
log_format: text
history_db_path: ./tmp/history.db
encryption_key_env: TEST_SENTINEL_MASTER_KEY

defaults:
  storage:
    type: local
    local_path: ./tmp/backups

databases:
  pg-encrypted:
    type: postgres
    host: localhost
    port: 5432
    username: sentinel
    password_env: TEST_PG_PASSWORD
    database: sentinel
    output: pg-encrypted.sql
