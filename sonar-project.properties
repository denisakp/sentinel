sonar.projectKey=sentinel
sonar.projectName=Sentinel
sonar.projectVersion=1.3.0

sonar.language=go
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude non-source, generated, infra, and doc paths from analysis
sonar.exclusions=\
  **/vendor/**,\
  **/testdata/**,\
  **/*_mock.go,\
  infra/**,\
  scripts/**,\
  docs/**,\
  .specify/**,\
  specs/**,\
  prds/**,\
  .prds/**,\
  .github/**,\
  .claude/**,\
  release-notes.md,\
  Makefile,\
  Dockerfile*,\
  docker-compose*.yml

# Tests live alongside code (*_test.go) and under tests/
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**/*.go
sonar.test.exclusions=**/vendor/**,**/testdata/**

# Coverage exclusions: wiring, fixtures, and the binary entrypoint
sonar.coverage.exclusions=\
  main.go,\
  internal/cli/root.go,\
  **/testdata/**,\
  **/*_mock.go,\
  tests/**

# Go coverage report
# Generate with: go test -race -coverprofile=coverage/unit.out ./...
sonar.go.coverage.reportPaths=coverage/unit.out

sonar.host.url=http://localhost:9009
