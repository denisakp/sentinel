name: Release
on:
  push:
    tags:
      # Widened from 'v1.*' so future v2.x tags also release (PRD 38 Q3).
      - "v*"
permissions:
  contents: write
  # Required for cosign keyless signing: lets the job mint a GitHub OIDC token
  # that cosign exchanges with Fulcio for a short-lived signing cert
  # (spec 053 / PRD 42). Without it, keyless signing fails.
  id-token: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # `hashes` feeds the SLSA provenance generator (spec 055 / PRD 48) — see
    # the binary-provenance job below. This job's own steps/permissions are
    # otherwise UNCHANGED; provenance generation must never affect what this
    # job already publishes (FR-006/FR-007).
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # GoReleaser needs full history + tags for changelog/version resolution.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Install cosign
        # Provides the cosign v3 binary used by the .goreleaser.yaml `signs:`
        # block to keyless-sign checksums.txt (spec 053 / PRD 42).
        uses: sigstore/cosign-installer@v4.1.0
      - name: Run GoReleaser
        # Fail-closed: no `continue-on-error` here. If cosign signing fails,
        # GoReleaser exits non-zero and the release publishes NOTHING — a
        # published release is always signed (spec 053 FR-012). Do not add
        # continue-on-error to this step.
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify checksums signature (smoke check)
        # Post-publication self-check (spec 053 FR-013): verify the just-signed
        # bundle against the tight release-workflow-on-tag identity, so a broken
        # signing/identity config fails THIS run instead of shipping unnoticed.
        # Fail-closed: no `continue-on-error`. The identity regexp MUST stay
        # identical to the one documented in README (single source of truth);
        # if this workflow file is renamed, update both.
        run: |
          cosign verify-blob \
            --certificate-identity-regexp 'https://github.com/denisakp/sentinel/.github/workflows/release.yml@refs/tags/.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt
      - id: hash
        name: Generate subject hashes for SLSA provenance
        # dist/checksums.txt is ALREADY in sha256sum-line format (GoReleaser's
        # `checksum:` block) — the exact format the SLSA generator's
        # base64-subjects input expects. Re-using it verbatim (rather than
        # re-deriving hashes from dist/*.tar.gz/*.zip) guarantees the attested
        # artifact set is IDENTICAL to the checksummed/signed set by
        # construction, not by convention (spec 055 FR-012).
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  binary-provenance:
    needs: [goreleaser]
    # A SEPARATE job, deliberately — not a step inside `goreleaser`. SLSA's
    # trust model requires the attestor's identity to be independent of the
    # builder's (spec 055 FR-002); a step would share goreleaser's single
    # OIDC token, which is exactly the self-attestation this exists to
    # prevent. Being a separate job is also what makes a provenance-only
    # failure structurally unable to affect goreleaser's already-published
    # outputs (FR-007) — no `continue-on-error` or `if:` logic needed on
    # either side; GitHub Actions job independence provides this for free.
    # A goreleaser failure means this job never runs (`needs:` semantics) —
    # no provenance is ever generated for a release that wasn't published
    # (FR-008).
    permissions:
      actions: read      # to read this workflow's path (embedded in the provenance)
      id-token: write     # to sign the provenance — its OWN identity, independent of goreleaser's
      contents: write      # to attach the attestation asset to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
