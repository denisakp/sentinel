name: Documentation site

# Builds and publishes the Sentinel documentation site (website/).
#
# On pull requests: build, link check, and accessibility audit; no deploy.
# On push to 1.x, or manual dispatch: the same gates, then deploy.
#
# Build and deploy are separate jobs on purpose. If the build fails, the deploy
# job never runs and the previously published site stays intact and reachable.

on:
  push:
    branches:
      - 1.x
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two publishes race. In-progress runs are allowed to finish so a
# half-uploaded artifact is never deployed.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check the site configuration
        run: npm run typecheck

      # This is the real gate. onBrokenLinks, onBrokenAnchors, and
      # onBrokenMarkdownLinks are all set to 'throw', so a broken internal link
      # or a stale heading anchor fails here rather than reaching a reader.
      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'custom' }}

      # Serve and audit in one step: a background process started in one step is
      # not reliably still there in the next.
      #
      # Automated auditing catches roughly half of WCAG 2.1 AA. The rest;
      # meaningful alt text, descriptive link text, heading nesting; is covered
      # by the authoring convention and by review, not by this step.
      - name: Accessibility audit (WCAG 2.1 AA)
        env:
          DOCS_BASE: /docs/
          DOCS_ORIGIN: https://sentinel.denisakp.me
        run: |
          set -euo pipefail
          npm run serve -- --no-open --port 3000 &
          SERVE_PID=$!
          trap 'kill "$SERVE_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sSf -o /dev/null "http://localhost:3000${DOCS_BASE}"; then
              echo "site is up"
              break
            fi
            sleep 2
          done

          curl -sSf -o /dev/null "http://localhost:3000${DOCS_BASE}" \
            || { echo "site did not come up within 60s" >&2; exit 1; }

          # On failure, re-run with the JSON reporter and print the exact colours
          # axe computed. The human-readable reporter names the offending element
          # but not the numbers, which is rarely enough to act on.
          if ! npm run a11y; then
            echo "--- re-running axe directly for the computed colours ---"
            npm run --silent a11y:json > a11y.json || true
            for u in $(node -e '
              const r = require("./a11y.json");
              for (const [url, res] of Object.entries(r.results ?? {})) {
                if (res.some(i => i.type === "error")) console.log(url);
              }
            '); do
              echo "### $u"
              node scripts/a11y-explain.mjs "$u" || true
            done
            exit 1
          fi

      # Docusaurus does NOT nest its output under baseUrl: with baseUrl '/docs/'
      # the files still land at the root of build/. That was invisible while the
      # site was a GitHub Pages project site, because Pages serves the artifact
      # root at /<repo>/, which happened to match baseUrl '/sentinel/'.
      #
      # With a custom domain the artifact root IS the domain root, so the files
      # would sit at / while every generated link points at /docs/. Nesting the
      # artifact one level restores the match.
      - name: Nest the artifact under /docs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p ../artifact/docs
          mv build/* ../artifact/docs/
          # A CNAME file has to sit at the artifact root, not inside /docs.
          if [ -f ../artifact/docs/CNAME ]; then
            mv ../artifact/docs/CNAME ../artifact/CNAME
          fi
          # Anything hitting the domain root goes to the documentation for now.
          # Replace this with a real landing page when there is one.
          cat > ../artifact/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Sentinel</title>
          <meta http-equiv="refresh" content="0; url=/docs/">
          <link rel="canonical" href="/docs/">
          <p><a href="/docs/">Sentinel documentation</a></p>
          HTML

      # Published URLs are permanent (FR-044). The site was live at
      # denisakp.github.io/sentinel/... before the custom domain existed.
      #
      # GitHub redirects the old origin to the new one and STRIPS the project
      # prefix, which is the part that is easy to get wrong:
      #
      #   denisakp.github.io/sentinel/concepts/backup
      #     -> 301 sentinel.denisakp.me/concepts/backup      (no /sentinel/)
      #
      # So the stubs belong at the domain root, mirroring the docs tree, not
      # under /sentinel/. A first attempt put them under /sentinel/ and every
      # previously published URL 404'd. The /sentinel/ copies are kept as well,
      # cheap insurance for anyone holding that literal path.
      #
      # Docusaurus cannot emit any of this: its client-redirects plugin only
      # writes under baseUrl.
      - name: Keep previously published URLs resolving
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd ../artifact
          count=0
          while IFS= read -r page; do
            rel="${page#docs/}"
            dest="/docs/${rel%.html}"
            stub=$(printf '<!doctype html>\n<meta charset="utf-8">\n<meta http-equiv="refresh" content="0; url=%s">\n<link rel="canonical" href="%s">\n<p>This page moved to <a href="%s">%s</a>.</p>\n' \
              "$dest" "$dest" "$dest" "$dest")
            # where the github.io redirect actually lands
            mkdir -p "$(dirname "$rel")"
            printf '%s' "$stub" > "$rel"
            # and the literal old path, in case anyone holds it
            mkdir -p "$(dirname "sentinel/$rel")"
            printf '%s' "$stub" > "sentinel/$rel"
            count=$((count + 1))
          done < <(find docs -name '*.html' -type f ! -name '404.html')
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=/docs/">\n' > sentinel/index.html
          # The root landing redirect is written above and must survive the loop.
          printf '<!doctype html>\n<meta charset="utf-8">\n<title>Sentinel</title>\n<meta http-equiv="refresh" content="0; url=/docs/">\n<link rel="canonical" href="/docs/">\n<p><a href="/docs/">Sentinel documentation</a></p>\n' > index.html
          echo "generated $count redirect stubs at the root and $count under /sentinel/"

          test -f concepts/backup.html || { echo "root stub missing" >&2; exit 1; }
          test -f docs/concepts/backup.html || { echo "real page missing" >&2; exit 1; }

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifact

  deploy:
    name: Deploy to GitHub Pages
    # Only publishes from the stable release line, or on an explicit manual run.
    # Pull requests build and audit but never deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
