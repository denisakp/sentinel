name: Integration Tests

on:
  push:
    branches:
      - develop
      - 1.x
  pull_request:
    branches:
      - develop
      - 1.x
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: install database client tools
        run: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client mysql-client
            
            # handle mariadb
            MARIADB_VERSION="11.8.6"
            wget -q "https://downloads.mariadb.org/rest-api/mariadb/${MARIADB_VERSION}/mariadb-${MARIADB_VERSION}-linux-systemd-x86_64.tar.gz" \
                     -O mariadb.tar.gz
            tar -xzf mariadb.tar.gz "mariadb-${MARIADB_VERSION}-linux-systemd-x86_64/bin/mariadb-dump" --strip-components=2
            sudo mv mariadb-dump /usr/local/bin/
            sudo chmod +x /usr/local/bin/mariadb-dump
            rm mariadb.tar.gz
            
            wget -qO- https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.14.1.deb -O mongodb-database-tools.deb
            sudo dpkg -i mongodb-database-tools.deb
      - name: check client tools
        run: |
          pg_dump --version
          mysqldump --version
          mariadb-dump --version
          mongodump --version
          
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: go mod download
      - name: Run integration tests
        run: go test -v -tags integration ./tests/integration/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: |
            coverage/
            *.log
