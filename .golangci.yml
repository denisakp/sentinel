run:
  timeout: 5m

output:
  formats:
    - format: colored-line-number

linters:
  disable-all: true
  enable:
    - forbidigo
    - govet

linters-settings:
  forbidigo:
    forbid:
      - p: '^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
        msg: "process-killing call in library code; return an error instead. See specs/016-remove-ping-fatal/spec.md FR-007."
      - p: '^os\.Exit$'
        msg: "do not exit from command bodies; return an error and let main.go map it. See internal/cli/exit_codes.go."
    analyze-types: true

issues:
  exclude-rules:
    - path: ^main\.go$
      linters: [forbidigo]
    - path: ^internal/cli/root\.go$
      linters: [forbidigo]
