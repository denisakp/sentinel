# GoReleaser configuration — cross-platform binary distribution (PRD 38).
#
# Sentinel is pure Go (no cgo — the SQLite monitor uses the pure-Go
# modernc.org/sqlite driver), so every target cross-compiles with
# CGO_ENABLED=0 and no cross-toolchain. Matches the flags used by
# infra/docker/Dockerfile (CGO_ENABLED=0, -trimpath, -ldflags "-s -w").
#
# Validate locally with: goreleaser release --snapshot --clean
# (produces all 5 binaries + archives + checksums.txt under dist/).
#
# Supply-chain signing: checksums.txt is signed with cosign keyless (GitHub
# OIDC + Fulcio/Rekor) via the `signs:` block below, producing a single
# sigstore bundle (checksums.txt.sigstore.json). Verify a download with
# `cosign verify-blob --bundle checksums.txt.sigstore.json checksums.txt`
# (see README → Installation). (spec 053 / PRD 42)
#
# SLSA build provenance: GoReleaser itself does NOT participate in
# generating it — this file only needs to keep producing checksums.txt in
# its current sha256sum-line format, which the SLSA generator's
# base64-subjects input consumes directly. The actual provenance generation
# (a second, independently-identified job calling
# slsa-framework/slsa-github-generator) lives entirely in
# .github/workflows/release.yml. (spec 055 / PRD 48)
version: 2

project_name: sentinel

builds:
  - id: sentinel
    main: .                  # main.go lives at the repo root
    binary: sentinel
    env:
      - CGO_ENABLED=0        # pure Go — matches infra/docker/Dockerfile
    flags:
      - -trimpath
    ldflags:
      # Stamp the real internal/version vars. GoVersion is NOT stamped —
      # internal/version.Get() sources it from runtime.Version() at runtime.
      - -s -w
      - -X github.com/denisakp/sentinel/internal/version.Version={{ .Version }}
      - -X github.com/denisakp/sentinel/internal/version.Commit={{ .FullCommit }}
      - -X github.com/denisakp/sentinel/internal/version.BuildDate={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # 5-target matrix per roadmap M4 / F-01: linux/{amd64,arm64},
      # darwin/{amd64,arm64}, windows/amd64. windows/arm64 excluded
      # (PRD 38 Q2 — one-line add if ever wanted).
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - sentinel
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - release-notes.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Cosign keyless signing of the checksums file (spec 053 / PRD 42). One
# signature over checksums.txt transitively covers every archive (verify the
# bundle, then `sha256sum -c`). Keyless: no long-lived key — the CI job's
# GitHub OIDC identity is exchanged for a short-lived Fulcio cert and logged
# in Rekor. `--yes` is required non-interactively in CI. cosign v3 emits a
# single self-contained bundle (signature + cert + inclusion proof), so no
# separate .sig/.pem files and no COSIGN_EXPERIMENTAL. `artifacts: checksum`
# signs ONLY checksums.txt; do not widen it. NOTE: `goreleaser --snapshot`
# skips signing — the bundle is only produced on a real (tagged) release.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: denisakp
    name: sentinel
  draft: false
  # Keep pointing operators at the consolidated changelog (PRD 38 Q6).
  footer: |
    ---
    See `release-notes.md` for the full changes summary. Each release ships
    prebuilt binaries for linux/darwin/windows (amd64 + arm64, minus
    windows/arm64) plus a SHA-256 `checksums.txt`; verify downloads with
    `sha256sum -c checksums.txt`.
